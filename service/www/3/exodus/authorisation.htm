<!DOCTYPE html>
<html lang="en">
<head>
    <title>Authorisation File</title>
    <script type="text/javascript">

        gmodule = 'GENERAL'
        gdatafilename = 'DEFINITIONS'
        gdictfilename = 'AUTHORISATION'
        gupdateonlymode = true
        gfirstelement = 'USER_ID'
    </script>
    <script type="text/javascript" src="scripts/client.js"></script>
    <script type="text/javascript" src="../exodus/scripts/authorisation.js"></script>
    <script type="text/javascript" src="../exodus/scripts/authorisation2.js"></script>
    <style type="text/css">
        .exotabs {
            display: inline-block;
            text-align: left;
            vertical-align: top;
        }
        .exotabs_bar {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }
        .exotab.exotab_active {
            font-weight: bold;
            border-style: inset;
        }
        .exotab_panel {
            display: none;
        }
        .exotab_panel.exotab_active {
            display: block;
        }
        .exotab_panel > .exoformpane {
            display: block;
            width: max-content;
            margin-left: auto;
            margin-right: auto;
        }
        /* Compact like schedules.htm .schedule_line_btn / action-stack exobuttons */
        #button_password,
        #button_tasks {
            font-size: 72%;
        }
    </style>
</head>
<body>
    <div align="center">
        <h1>
            Authorisation File</h1>
        <div class="exotabs" id="authorisation_tabs">
            <div class="exotabs_bar" role="tablist">
                <button type="button" role="tab" class="exotab exotab_active"
                    id="authorisation_tabbtn_users" exo_onclick="authorisation_tabs_show_sync('users')">Users</button>
                <button type="button" role="tab" class="exotab"
                    id="authorisation_tabbtn_tasks" exo_onclick="authorisation_tabs_show_sync('tasks')">Tasks</button>
            </div>
            <div class="exotab_panel exotab_active" id="authorisation_tabpanel_users" role="tabpanel">
        <input style="display: none" id="KEY" />
        <table class="exoform authorisation_users_table">
            <thead>
                <tr>
                    <th>
                        User Id:<br />
                        Expiry:
                    </th>
                    <td>
                        Password<br />
                        auto-expiry<br />
                        days:<input id="PASSWORD_AUTOEXPIRY_DAYS" />
                    </td>
                    <td>
                        User Name:<br />
                        Email Address:<br />
                        <input id="button_changeemaildomain" title="Change email domain name" class="exobutton"
                            type="button" exotype="B" value="Change domain" exo_onclick="await authorisation_changeallemaildomains()">
                    </td>
                    <th>
                        Last Login
                    </th>
                    <th class="authorisation_keys_col">
                        Keys:<br />
                        Allowed IP Numbers:
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <input id="USER_ID" /><br />
                        <input id="EXPIRY_DATE" />
                    </td>
                    <td>
                        <input id="button_password" exogroupno="1" title="Set the password for the user"
                            exo_onclick="await user_setpassword(false,this)" class="exobutton" type="button"
                            exotype="B" value="Password" />
                        <input id="button_tasks" exogroupno="1" title="See user's authorised tasks" class="exobutton"
                            type="button" exotype="B" value="Tasks" exo_onclick="await user_showtasks()" />
                    </td>
                    <td>
                        <input id="USER_NAME" />
                        <input id="EMAIL_ADDRESS" />
                    </td>
                    <td>
                        <span id="LAST_LOGIN_DATE_TIME"></span><br />
                        <span id="LAST_LOGIN_LOCATION"></span>
                    </td>
                    <td class="authorisation_keys_col">
                        <input id="KEYS" />
                        <input id="IP_NUMBERS" />
                    </td>
                </tr>
            </tbody>
        </table>
            </div>
            <div class="exotab_panel" id="authorisation_tabpanel_tasks" role="tabpanel">
        <table class="exoform">
            <thead>
                <tr>
                    <th id="TASK_ID_title">
                        Task Id
                    </th>
                    <th id="LOCKS_title">
                        Locks
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <input id="TASK_ID" />
                    </td>
                    <td>
                        <input id="LOCKS" />
                    </td>
                </tr>
            </tbody>
        </table>
            </div>
        </div>
    </div>
</body>
</html>
