<!DOCTYPE html>
<html lang="en">
<head>
    <title>Authorisation File</title>
    <script type="text/javascript">

        gmodule = 'GENERAL'
        gdatafilename = 'DEFINITIONS'
        gdictfilename = 'AUTHORISATION'
        gupdateonlymode = true
        gfirstelement = 'USER_ID'
    </script>
    <script type="text/javascript" src="scripts/client.js"></script>
    <script type="text/javascript" src="../exodus/scripts/authorisation.js"></script>
    <script type="text/javascript" src="../exodus/scripts/authorisation2.js"></script>
    <style type="text/css">
        .exodustabs {
            display: inline-block;
            text-align: left;
            vertical-align: top;
        }
        .exodustabs_bar {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }
        .exodustab.exodustab_active {
            font-weight: bold;
            border-style: inset;
        }
        .exodustab_panel {
            display: none;
        }
        .exodustab_panel.exodustab_active {
            display: block;
        }
        .exodustab_panel > .exodusformpane {
            display: block;
            width: max-content;
            margin-left: auto;
            margin-right: auto;
        }
        /* Cap Keys / IP Numbers column — td limit + span must not enforce dbform min-width */
        .authorisation_users_table[exogroupno] {
            table-layout: fixed;
        }
        .authorisation_users_table .authorisation_keys_col {
            width: 12rem;
            max-width: 12rem;
            overflow-wrap: anywhere;
        }
        .authorisation_users_table .exodusid_KEYS,
        .authorisation_users_table .exodusid_IP_NUMBERS {
            min-width: 0 !important;
            max-width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div align="center">
        <h1>
            Authorisation File</h1>
        <div class="exodustabs" id="authorisation_tabs">
            <div class="exodustabs_bar" role="tablist">
                <button type="button" role="tab" class="exodustab exodustab_active"
                    id="authorisation_tabbtn_users" exodusonclick="authorisation_tabs_show_sync('users')">Users</button>
                <button type="button" role="tab" class="exodustab"
                    id="authorisation_tabbtn_tasks" exodusonclick="authorisation_tabs_show_sync('tasks')">Tasks</button>
            </div>
            <div class="exodustab_panel exodustab_active" id="authorisation_tabpanel_users" role="tabpanel">
        <input style="display: none" id="KEY" />
        <table class="exodusform authorisation_users_table" bordercolor="#d0d0d0">
            <thead>
                <tr>
                    <th>
                        User Id:<br />
                        Expiry:
                    </th>
                    <td>
                        Password<br />
                        auto-expiry<br />
                        days:<input id="PASSWORD_AUTOEXPIRY_DAYS" />
                    </td>
                    <td>
                        User Name:<br />
                        Email Address:<br />
                        <input id="button_changeemaildomain" title="Change email domain name" class="exodusbutton"
                            type="button" exodustype="B" value="Change domain" exodusonclick="await authorisation_changeallemaildomains()">
                    </td>
                    <th>
                        Last Login
                    </th>
                    <th class="authorisation_keys_col">
                        Keys:<br />
                        Allowed IP Numbers:
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <input id="USER_ID" /><br />
                        <input id="EXPIRY_DATE" />
                    </td>
                    <td>
                        <input id="button_password" exogroupno="1" title="Set the password for the user"
                            exodusonclick="await user_setpassword(false,this)" class="exodusbutton" type="button"
                            exodustype="B" value="Password" />
                        <input id="button_tasks" exogroupno="1" title="See user's authorised tasks" class="exodusbutton"
                            type="button" exodustype="B" value="Tasks" exodusonclick="await user_showtasks()" />
                    </td>
                    <td>
                        <input id="USER_NAME" />
                        <input id="EMAIL_ADDRESS" />
                    </td>
                    <td>
                        <span id="LAST_LOGIN_DATE_TIME"></span>
                        <span id="LAST_LOGIN_LOCATION"></span>
                    </td>
                    <td class="authorisation_keys_col">
                        <input id="KEYS" />
                        <input id="IP_NUMBERS" />
                    </td>
                </tr>
            </tbody>
        </table>
            </div>
            <div class="exodustab_panel" id="authorisation_tabpanel_tasks" role="tabpanel">
        <table class="exodusform" bordercolor="#d0d0d0">
            <thead>
                <tr>
                    <th id="TASK_ID_title">
                        Task Id
                    </th>
                    <th id="LOCKS_title">
                        Locks
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <input id="TASK_ID" />
                    </td>
                    <td>
                        <input id="LOCKS" />
                    </td>
                </tr>
            </tbody>
        </table>
            </div>
        </div>
    </div>
</body>
</html>
