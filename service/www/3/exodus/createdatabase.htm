<!DOCTYPE html>
<html lang="en">
<head>
    <script type="text/javascript">
        var gmodule = 'GENERAL'
        var gdatafilename = 'CREATEDATABASE'

        //evade looking for script since is incorporated below
        dict_CREATEDATABASE = ''

    </script>
    <script type="text/javascript" src='../exodus/scripts/client.js'></script>
    <script type="text/javascript" src='../exodus/scripts/system.js'></script>
    <script type="text/javascript">
        var ggroupidgroupn
        var guseridgroupn
        async function dict_CREATEDATABASE(parameters) {

            //returns an array representing details to create new database

            var dict = []//of dictrecs
            var din = -1
            groupn = 0
			var di

            ++groupn
            ggroupidgroupn = groupn

            di = dict[++din] = dictrec('OLD_DATABASE_CODE', 'F', 3)
			await system_dict_datasetcode(di, false, false,'')
			di.validation = 'await  database_val_olddatabasecode()'
			di.length = 20
			exo_dict_text(di)
            di.required = true

            di = dict[++din] = dictrec('NEW_DATABASE_CODE', 'F', 2)
			di.length = '25'
			exo_dict_text(di);
            di.required = true
			di.validation = 'await  database_val_newdatabasecode()'

            di = dict[++din] = dictrec('NEW_DATABASE_NAME', 'F', 1)
			di.validcharacters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'
			di.validcharacters += di.validcharacters.toLowerCase()
			//di.validcharacters += '0123456789-\'&() '
			di.validcharacters += '0123456789-\'&() .'
			di.lowercase = true
			//di.maxlength = '25'
			di.maxlength = '80'
			di.length = '25'
            di.required = true

            return dict

        }

        async function form_postinit() {

            gparameters.savebuttonvalue = 'Create'

            return true

        }
        async function form_prewrite() {
            return await exoui_okcancel('Are you sure ?', 2)
        }
        async function form_postwrite() {
			await cleardoc()
            return true
        }
        async function database_val_olddatabasecode(){
            if (gvalue==gdataset) {
                return await exoui_invalid('The old database and the database you are curently logged into cannot be the same.\nLogin to a different database and try again.');
            }
            return true
        }
		//allow lowercase alphanumeric only
		async function database_val_newdatabasecode(){
			if (!gvalue.match('^[0-9a-z]+$')){
				return await exoui_invalid('New Database code must be lowercase alphanumeric')
				//return false
			}
			return true
		}

    </script>
    <title>Create Database</title>
</head>
<body>
    <div align="center">
        <h1 id="head1">
            Create Database</h1>
        <table class="exodusform">
		            
            <tr>
                <tr>
                    <th>
                        Old Database Code
                    </th>
                    <td>
                        <input id="OLD_DATABASE_CODE" />
                    </td>
                </tr>
            <tr>


		    <tr>
                <tr>
                    <th>
                        New Database Code
                    </th>
                    <td>
                        <input id="NEW_DATABASE_CODE" />
                    </td>
                </tr>
            <tr>

            <tr>
                <tr>
                    <th>
                        New Database Name
                    </th>
                    <td>
                        <input id="NEW_DATABASE_NAME" />
                    </td>
                </tr>
            <tr>
        
        </table>
    </div>
</body>
</html>
