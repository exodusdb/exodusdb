<!DOCTYPE html>
<html lang="en">
<head>
    <script type="text/javascript">
        var gmodule = 'GENERAL'
        var gdatafilename = 'EMAILUSERS'

        //evade looking for script since is incorporated below
        dict_EMAILUSERS = ''

    </script>
    <script type="text/javascript" src='../exodus/scripts/client.js'></script>
    <script type="text/javascript" src='../exodus/scripts/system.js'></script>
    <script type="text/javascript">
        var ggroupidgroupn
        var guseridgroupn
        async function dict_EMAILUSERS(parameters) {

            //returns an array representing the client dictionary

            var dict = []//of dictrecs
            var din = -1
            groupn = 0

            ++groupn
            ggroupidgroupn = groupn

            di = dict[++din] = dictrec('TO_GROUP_CODE', 'F', 1, '', groupn)
            //N=Include Dept Numbers
            //A=Groups with Active Users only
            await system_dict_departmentcode(di, many = true, 'NA')
            di.required = true
            di.unique = true

            di = dict[++din] = dictrec('TO_GROUP_NAME', 'S', '', '', groupn)
            await system_dict_username(di, 'TO_GROUP_CODE')

            ++groupn
            guseridgroupn = groupn

            di = dict[++din] = dictrec('TO_USER_CODE', 'F', 2, '', groupn)
            await system_dict_usercode(di, many = true, withtask = '', withlocks = '', sselect = 'WITH LIVE_USER_WITH_EMAIL')
            di.required = true
            di.unique = true

            di = dict[++din] = dictrec('TO_USER_NAME', 'S', '', '', groupn)
            await system_dict_username(di, 'TO_USER_CODE')

            ++groupn
            di = dict[++din] = dictrec('CC_USER_CODE', 'F', 3, '', groupn)
            await system_dict_usercode(di, many = true)
            di.unique = true

            di = dict[++din] = dictrec('CC_USER_NAME', 'S', '', '', groupn)
            await system_dict_username(di, 'CC_USER_CODE')

            di = dict[++din] = dictrec('EMAIL_SUBJECT', 'F', 4)
            di.length = 73
            exodus_dict_text(di)
            di.required = true

            di = dict[++din] = dictrec('EMAIL_MESSAGE', 'F', 5)
            exodus_dict_textarea(di, 20)
            di.required = true

            return dict

        }

        async function form_postinit() {

            gparameters.savebuttonvalue = 'Send'

            return true

        }
        async function form_prewrite() {
            return await exodusokcancel('Ok to send email ?', 2)
        }
        async function form_postwrite() {
            await deleteallrows(ggroupidgroupn)
            await deleteallrows(guseridgroupn)
            return true
        }
    </script>
    <title>Email Users</title>
</head>
<body>
    <div align="center">
        <h1 id="head1">
            Email Users</h1>
        <table class="exodusform" bordercolor="#d0d0d0">
            <tr>
                <th>
                    To groups:
                </th>
                <td>
                    <table>
                        <tr>
                            <td>
                                <input id="TO_GROUP_CODE" />
                            </td>
                            <td>
                                <span id="TO_GROUP_NAME" />
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr>
                <th>
                    To users:
                </th>
                <td>
                    <table>
                        <tr>
                            <td>
                                <input id="TO_USER_CODE" />
                            </td>
                            <td>
                                <span id="TO_USER_NAME" />
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr>
                <th>
                    Subject
                </th>
                <td style="text-align: left">
                    <input id="EMAIL_SUBJECT" />
                </td>
            </tr>
            <tr>
                <th>
                    Message
                </th>
                <td>
                    <textarea id="EMAIL_MESSAGE" />
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
